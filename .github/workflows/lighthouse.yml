# CG-36: on every PR that touches the page, build site/ with real data (tools/build_site.sh)
# and measure it with Lighthouse CI; the PR fails when a category drops below the budget in
# lighthouserc.json. Reports are kept as an artifact for 14 days, not uploaded anywhere public.
name: Lighthouse

on:
  pull_request:
    paths: [web/**, backend/src/main/**, tools/build_site.sh, lighthouserc.json, .github/workflows/lighthouse.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: tools/build_site.sh
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse
          path: lhci/
          retention-days: 14
