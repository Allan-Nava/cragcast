spring.application.name=cragcast-backend

# Local default: the PostgreSQL of docker-compose.yml. In Kubernetes the three values come
# from the cragcast-db secret as environment variables.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/cragcast}
spring.datasource.username=${DATABASE_USER:cragcast}
spring.datasource.password=${DATABASE_PASSWORD:cragcast}

# The schema belongs to Flyway; Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Liveness and readiness probes for Kubernetes: /actuator/health/liveness, /readiness.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Weather. Overridable for tests or a self-hosted Open-Meteo.
cragcast.open-meteo.base-url=${OPEN_METEO_URL:https://api.open-meteo.com}

# Crags: imported from classpath:data/crags.json (OpenStreetMap) at startup.
cragcast.import-crags=true
# Weather: refreshed at startup and every hour at :07, Italian time.
cragcast.refresh.enabled=true
cragcast.refresh.cron=0 7 * * * *

# History (CG-101): the history branch's CSVs copied into crag_history at startup, from the
# first month on, and each night after history.yml; a day is replaced whole, as the CSV does.
cragcast.history.enabled=true
cragcast.history.base-url=${HISTORY_URL:https://raw.githubusercontent.com/Allan-Nava/cragcast/history}
cragcast.history.since=2026-10
cragcast.history.cron=0 50 23,5 * * *
