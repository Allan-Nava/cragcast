# CG-110: the page on the Pi. Static files from the Vite build; the paths GitHub Pages fills
# with the hourly export come live from the Spring service instead (SiteController).
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS, read on each request: nginx starts even when the backend is not up yet.
    resolver 127.0.0.11 valid=30s;
    set $backend http://backend:8080;

    location = /data/conditions.json { proxy_pass $backend; }
    location /api/v1/ { proxy_pass $backend; }
    location /c/ { proxy_pass $backend; }

    # CG-35: the service worker and the page are network first; never a stale copy from nginx.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ =404; }
}
