apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          # Built for linux/arm64 and pushed by CI (CG-9).
          image: ghcr.io/allan-nava/cragcast-backend:main
          env:
            - name: DATABASE_URL
              value: jdbc:postgresql://db:5432/cragcast
            - name: DATABASE_USER
              value: cragcast
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cragcast-db
                  key: password
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            initialDelaySeconds: 20
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            initialDelaySeconds: 40
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8080
