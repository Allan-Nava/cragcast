# Builds the backend image for linux/arm64 — the architecture of the Oracle Ampere VM — and
# pushes it to GHCR on every push to main that touches the backend. The runner is ARM itself,
# so there is no QEMU emulation and the Maven build runs at native speed.
name: Image

on:
  push:
    branches: [main]
    paths: [backend/**, data/crags.json, .github/workflows/image.yml]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  backend:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/allan-nava/cragcast-backend:main
            ghcr.io/allan-nava/cragcast-backend:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max
