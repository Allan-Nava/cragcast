# The serverless cragcast: every hour, score today, tomorrow and the day after for every crag in
# data/crags.json with the Java scorer, write site/data/conditions.json and publish site/ on
# GitHub Pages. Free for a public repository; no VM, no database.
name: Pages

on:
  schedule:
    # CG-43: every 3 hours, off the top of the hour when GitHub's queue is busiest. Open-Meteo's
    # free tier counts each place (10,000 a day): ~820 places × 8 runs stays well inside it.
    - cron: "17 */3 * * *"
  push:
    branches: [main]
    paths: [web/**, data/**, assets/logo.svg, backend/src/main/**, tools/build_site.sh, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Score every crag for today, tomorrow and the day after, and build site/
        run: tools/build_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
