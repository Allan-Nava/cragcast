# k3s ships Traefik as its ingress controller. The host and HTTPS (cert-manager) come with
# the domain, CG-8; until then the API answers on the VM's public IP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 80
