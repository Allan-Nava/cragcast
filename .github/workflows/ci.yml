name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # The runner has Docker, so the Testcontainers tests that a laptop without Docker
      # skips run here against a real PostgreSQL. CG-47: verify fails below the coverage floor.
      - run: ./mvnw -B verify
      - name: Coverage to the run summary
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import csv, pathlib
          f = pathlib.Path("target/site/jacoco/jacoco.csv")
          if f.exists():
              rows = list(csv.DictReader(f.open()))
              cov = sum(int(r["LINE_COVERED"]) for r in rows)
              tot = cov + sum(int(r["LINE_MISSED"]) for r in rows)
              print(f"### Backend coverage\n\nLines: **{100 * cov / tot:.1f}%** ({cov}/{tot})")
          PY

  # CG-10: the page — types, unit and component tests, and a production build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      # CG-47: the tests with coverage; vite.config.ts holds the floors.
      - run: npm run coverage
      - name: Coverage to the run summary
        if: always()
        run: |
          # shellcheck disable=SC2016  # ${k} is a JavaScript template literal, not shell
          node -e 'const t=require("./coverage/coverage-summary.json").total;
            console.log("### Page coverage\n\n| | % |\n|---|---|\n" +
            ["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct} |`).join("\n"))' | tee -a "$GITHUB_STEP_SUMMARY"
      - run: npm run build

  # CG-51: the built page end to end in Chromium (desktop and a phone), fixture data, no tile
  # requests; an axe scan fails on serious or critical accessibility violations.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  # CG-42: the OSM import's rules (which objects are crags, how sectors fold) on made-up data.
  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # CG-47: coverage.py over the tools (the tests themselves left out); fails below the floor.
      - run: pip install coverage==7.6.1
      - run: coverage run --source=tools --omit='tools/test_*' -m unittest discover -s tools -p 'test_*.py' -v
      - run: coverage report --show-missing --fail-under=97   # CG-47 floor, raised as tests are added (CG-48: 97%)
      - name: Coverage to the run summary
        if: always()
        run: |
          echo "### Tools coverage: **$(coverage report --format=total)%**" | tee -a "$GITHUB_STEP_SUMMARY"

  # CG-52: the plumbing — actionlint on the workflows (it runs shellcheck on every run: block)
  # and shellcheck on the scripts.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint 1.7.12
        run: |
          v=1.7.12; f="actionlint_${v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${v}/${f}"
          curl -sSfLO "https://github.com/rhysd/actionlint/releases/download/v${v}/actionlint_${v}_checksums.txt"
          grep " ${f}\$" "actionlint_${v}_checksums.txt" | sha256sum -c -
          tar xzf "$f" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: actionlint -oneline
      - run: shellcheck tools/*.sh infra/oci/*.sh

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/oci
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  backlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Allan-Nava/backlogsync@backlogsync--v0.1.1
        with:
          command: check
