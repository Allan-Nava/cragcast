# CG-37: every hour, after the Pages build at :17, check that cragcast answers (checkfleet, with
# monitoring/checkfleet.yml) and that its data is fresh. A failure fails the run, and GitHub
# emails the repository's owner — the alert, with no extra service.
name: Uptime

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CHECKFLEET_VERSION: "1.34.2"
  MAX_AGE_MINUTES: "150"      # built hourly: two missed runs and a margin

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install checkfleet (checksum verified)
        run: |
          v="$CHECKFLEET_VERSION"; f="checkfleet_${v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/Allan-Nava/checkfleet/releases/download/v${v}/${f}"
          curl -sSfLO "https://github.com/Allan-Nava/checkfleet/releases/download/v${v}/checksums.txt"
          grep " ${f}\$" checksums.txt | sha256sum -c -
          tar xzf "$f" checkfleet
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Page, data, API and TLS answer
        run: |
          # This run only writes the report; the run below, with --exit-on bad, decides the job.
          checkfleet check all --config monitoring/checkfleet.yml --output markdown > report.md || true
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          checkfleet check all --config monitoring/checkfleet.yml --exit-on bad
      - name: The data is fresh
        run: |
          python3 - <<'PY'
          import datetime, json, os, sys, urllib.request
          url = "https://allan-nava.github.io/cragcast/api/v1/crags.json"
          meta = json.load(urllib.request.urlopen(url, timeout=20))["meta"]
          made = datetime.datetime.fromisoformat(meta["generatedAt"].replace("Z", "+00:00"))
          age = (datetime.datetime.now(datetime.timezone.utc) - made).total_seconds() / 60
          limit = int(os.environ["MAX_AGE_MINUTES"])
          line = f"data generated {made:%Y-%m-%d %H:%M} UTC, {age:.0f} min ago (limit {limit})"
          print(line)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(("\n**Stale data:** " if age > limit else "\nData fresh: ") + line + "\n")
          sys.exit(1 if age > limit else 0)
          PY
