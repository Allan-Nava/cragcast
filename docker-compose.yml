# Local development: PostgreSQL alone (run the backend with ./mvnw spring-boot:run), or both
# with `docker compose up --build`.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cragcast
      POSTGRES_USER: cragcast
      POSTGRES_PASSWORD: cragcast   # local only; Kubernetes reads it from a secret
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cragcast"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/cragcast
      DATABASE_USER: cragcast
      DATABASE_PASSWORD: cragcast
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
