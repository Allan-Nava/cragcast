# The serverless cragcast: every hour, score today and tomorrow for every crag in
# data/crags.json with the Java scorer, write site/data/conditions.json and publish site/ on
# GitHub Pages. Free for a public repository; no VM, no database.
name: Pages

on:
  schedule:
    - cron: "17 * * * *"      # hourly, off the top of the hour when GitHub's queue is busiest
  push:
    branches: [main]
    paths: [site/**, data/**, assets/logo.svg, backend/src/main/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile the scorer
        working-directory: backend
        run: |
          ./mvnw -q -B -DskipTests package
          ./mvnw -q -B dependency:build-classpath -Dmdep.outputFile=target/cp.txt -Dmdep.includeScope=runtime
      - name: Score every crag for today and tomorrow
        working-directory: backend
        run: java -cp "target/classes:$(cat target/cp.txt)" io.github.allannava.cragcast.export.ConditionsExport ../data/crags.json ../site/data/conditions.json ../site/api/v1
      - run: cp assets/logo.svg site/logo.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
